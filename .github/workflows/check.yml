name: Hourly DOE check

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 (UTC)
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: doe-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check DOE sources
        id: check
        continue-on-error: true
        run: python monitor/check.py

      - name: Save results
        run: |
          git config user.name "ak-voting-site-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "DOE check $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --quiet
            git push
          fi

      - name: Flag a failed pull
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::One or both DOE sources failed to load. The last good data was kept. See data/status.json."
          exit 1
